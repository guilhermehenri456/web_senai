<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabela</title>
    <link rel="stylesheet" href="assets/Tabela.css">
</head>
<body>
<table>
    <thead>
    <tr>
        <th colspan="2">Nome</th>
        <th>Idade</th>
        <th>cpf</th>
    </tr>
    </thead>
    <tbody>
        <!-- tr define uma linha -->
        <tr>
            <!-- td define uma célula -->
            <td>Joao</td>
            <td>Silva</td>
            <td>16</td>
            <td>222222</td>
        </tr>

        <tr>
            <!-- td define uma célula -->
            <td>Maria</td>
            <td>Vitoria</td>
            <td>17</td>
            <td>222222</td>
        </tr>
    </tbody>
</table>
</body>
</html>
